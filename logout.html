<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background-color:#f2f2f2;
        margin:0;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .logout-box{
        background:white;
        padding:30px;
        width:300px;
        text-align:center;
        border:1px solid #ccc;
        border-radius:10px;
        box-shadow:0 4px 8px rgba(0,0,0,0.2);
    }

    h2{
        color:#1f4e79;
        margin-bottom:10px;
    }

    p{
        color:#555;
        margin-bottom:20px;
    }

    button{
        background-color:#1f4e79;
        color:white;
        border:none;
        padding:10px 20px;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background-color:#163b5c;
    }

    @media screen and (max-width:600px){
        .logout-box{
            width:90%;
        }
    }
</style>

</head>
<body>

<div class="logout-box">
    <h2>Logout</h2>
    <p>Are you sure you want to logout?</p>

    <button onclick="logout()">Logout</button>
</div>

<script>
function logout() {
    alert("Logged out successfully!");
    window.location.href = "index.html";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f2f2f2;
            margin:0;
            text-align:center;
        }

        h1{
            background-color:#1f4e79;
            color:white;
            padding:15px;
        }

        table{
            width:80%;
            margin:20px auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:10px;
        }

        th{
            background-color:#1f4e79;
            color:white;
        }

        @media screen and (max-width:600px){

            table{
                width:95%;
            }

            th,td{
                font-size:14px;
                padding:8px;
            }
        }
    </style>
</head>

<body>

    <h1>Business Reports</h1>

    <table>
        <tr>
            <th>Report</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>Sales Report</td>
            <td>Completed</td>
        </tr>

        <tr>
            <td>Revenue Report</td>
            <td>Completed</td>
        </tr>

        <tr>
            <td>Customer Report</td>
            <td>Generated</td>
        </tr>

        <tr>
            <td>Product Report</td>
            <td>Updated</td>
        </tr>
    </table>


</body>
</html>

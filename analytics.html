<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
        }

        h1{
            background-color: #1f4e79;
            color: white;
            padding: 15px;
        }

        .box{
            width: 300px;
            margin: 20px auto;
            padding: 15px;
            background-color: white;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>Analytics Dashboard📊</h1>

    <div class="box">
        <h3>Total Sales Analysis</h3>
        <p>Monthly Sales : ₹1,20,000</p>
    </div>

    <div class="box">
        <h3>Revenue Analysis</h3>
        <p>Monthly Revenue : ₹2,45,000</p>
    </div>

    <div class="box">
        <h3>Customer Analysis</h3>
        <p>Total Customers : 540</p>
    </div>

</body>
</html>
